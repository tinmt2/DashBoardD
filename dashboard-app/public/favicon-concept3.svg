<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="db3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="db3-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="db3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect x="2.5" y="2.5" width="59" height="59" rx="15" fill="url(#db3-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.8" />

  <g filter="url(#db3-shadow)">
    <!-- Interlocking Ribbon Loop -->
    <path 
      d="M22 47 V17 C22 17 38 14 46 22 C54 30 54 35 47 43 C41 49 32 49 22 49" 
      stroke="url(#db3-ribbon)" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <circle cx="35" cy="32" r="3.5" fill="#60a5fa" />
  </g>
</svg>